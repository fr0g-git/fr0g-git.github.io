<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog | Cybersecurity Portfolio</title>
    <style>
        /* ===== Parrot OS 配色 ===== */
        :root {
            --bg-primary:    #0a0e14;
            --bg-secondary:  #111820;
            --bg-card:       #141b24;
            --bg-card-hover: #1a2332;
            --neon-green:    #12e857;
            --neon-cyan:     #05d9e8;
            --neon-blue:     #2979ff;
            --text-primary:  #f0f0f0;
            --text-secondary:#a0b4c8;
            --text-muted:    #667788;
            --border:        #1e2d3d;
            --code-bg:       #0d1117;
            --tag-bg:        rgba(18,232,87,0.1);
            --tag-border:    rgba(18,232,87,0.3);
            --font-mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            --font-sans:     'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background:
                radial-gradient(ellipse at 15% 100%, rgba(18,232,87,0.07), transparent 55%),
                var(--bg-primary);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 1.05rem;
            line-height: 1.8;
            min-height: 100vh;
        }

        /* ===== 背景動態格線 ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                linear-gradient(rgba(18,232,87,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18,232,87,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== 首頁：上方列 / 左介紹 / 右目錄 / 下方列 ===== */
        .home {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 5fr 7fr;
            grid-template-rows: 64px 1fr auto;
            min-height: 100vh;
        }
        .masthead {
            grid-column: 1 / -1;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2.5rem;
            border-bottom: 1px solid var(--border);
            background: rgba(10,14,20,0.6);
            font-family: var(--font-mono); font-size: 0.9rem;
        }
        .logo { color: var(--neon-green); text-decoration: none; font-weight: 700; letter-spacing: 0.5px; }
        .logo span { color: var(--text-muted); font-weight: 400; }
        .status { display: flex; align-items: center; gap: 0.55rem; color: var(--text-secondary); font-size: 0.78rem; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }

        /* ===== Hero（左欄，貼底） ===== */
        .intro {
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 3rem 2.5rem 3.5rem;
            border-right: 1px solid var(--border);
            animation: fadeIn 0.5s ease;
        }
        .hero-greeting { font-family: var(--font-mono); color: var(--neon-cyan); font-size: 1rem; margin-bottom: 1.2rem; }
        .hero-hello { font-family: var(--font-mono); color: var(--text-primary); font-size: 1.1rem; }
        .hero-name {
            font-family: var(--font-mono); font-size: clamp(3.5rem, 7vw, 6.5rem); font-weight: 800;
            color: var(--neon-green); line-height: 1.05; letter-spacing: -1px; margin-bottom: 1.8rem;
            text-shadow: 0 0 28px rgba(18,232,87,0.4);
        }
        .hero-tagline { border-top: 1px solid var(--border); padding-top: 1.2rem; max-width: 480px; }
        .hero-title { font-family: var(--font-mono); font-size: 1.1rem; color: var(--text-primary); margin-bottom: 0.5rem; }
        .hero-desc { color: var(--text-secondary); font-size: 0.95rem; }
        .terminal-prompt { font-family: var(--font-mono); color: var(--text-muted); font-size: 0.95rem; margin-top: 1.8rem; }
        .terminal-prompt .cursor {
            display: inline-block; width: 8px; height: 1.1em; background: var(--neon-green);
            animation: blink 1s step-end infinite; vertical-align: text-bottom; margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ===== 目錄（右欄） ===== */
        .index {
            display: flex; flex-direction: column; justify-content: center;
            padding: 3rem 4.5rem;
            background: rgba(17,24,32,0.45);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .index-list { list-style: none; }
        .index-list li:first-child .index-link { border-top: 1px solid var(--border); }
        .index-link {
            display: grid; grid-template-columns: 44px 1fr auto 28px; align-items: center; gap: 0 1.3rem;
            padding: 1.3rem 0.8rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary); text-decoration: none;
            transition: background-color 0.2s;
        }
        .index-num {
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); border-radius: 3px;
            font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted);
            transition: all 0.2s;
        }
        .index-text { display: flex; flex-direction: column; }
        .index-title { font-size: 1.55rem; font-weight: 700; line-height: 1.3; }
        .index-cmd { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); transition: color 0.2s; }
        .index-cmd::before { content: '$ '; }
        .index-desc { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-secondary); text-align: right; }
        .index-arrow { font-family: var(--font-mono); color: var(--text-muted); text-align: right; transition: all 0.2s; }
        .index-link:hover, .index-link.active { background: rgba(18,232,87,0.05); }
        .index-link:hover .index-num, .index-link.active .index-num { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 12px rgba(18,232,87,0.2); }
        .index-link:hover .index-cmd, .index-link.active .index-cmd { color: var(--neon-green); }
        .index-link:hover .index-arrow, .index-link.active .index-arrow { color: var(--neon-green); transform: translateX(4px); }
        .index-link:focus-visible { outline: 1px solid var(--neon-green); outline-offset: -1px; }

        /* ===== 下方列 ===== */
        .colophon {
            grid-column: 1 / -1;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            padding: 1rem 2.5rem;
            border-top: 1px solid var(--border);
            background: rgba(10,14,20,0.7);
        }
        .colophon-links { display: flex; border: 1px solid var(--border); border-radius: 3px; }
        .colophon-links a {
            padding: 0.5rem 1.1rem; font-family: var(--font-mono); font-size: 0.8rem;
            color: var(--text-primary); text-decoration: none; transition: all 0.2s;
        }
        .colophon-links a + a { border-left: 1px solid var(--border); }
        .colophon-links a:hover { color: var(--neon-green); background: rgba(18,232,87,0.06); }
        .colophon-note { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); }

        /* ===== 側滑面板 ===== */
        .scrim {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(5,8,12,0.6);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .drawer {
            position: fixed; top: 0; right: 0; z-index: 60;
            width: min(780px, 100vw); height: 100vh;
            display: flex; flex-direction: column;
            background: var(--bg-secondary); border-left: 1px solid var(--border);
            box-shadow: -20px 0 60px rgba(0,0,0,0.4);
            transform: translateX(100%); visibility: hidden;
            transition: transform 0.35s cubic-bezier(.2,.8,.2,1), visibility 0s 0.35s;
        }
        body.drawer-open { overflow: hidden; }
        body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
        body.drawer-open .drawer { transform: none; visibility: visible; transition: transform 0.35s cubic-bezier(.2,.8,.2,1), visibility 0s; }
        .drawer-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.9rem 1.8rem; border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
        }
        .drawer-id { display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem; color: var(--text-primary); }
        .drawer-num { border: 1px solid var(--neon-green); color: var(--neon-green); border-radius: 3px; padding: 0.1rem 0.5rem; font-size: 0.75rem; }
        .drawer-actions { display: flex; gap: 0.5rem; }
        .drawer-btn {
            width: 36px; height: 36px; background: none; cursor: pointer;
            border: 1px solid var(--border); border-radius: 3px;
            color: var(--text-primary); font-family: var(--font-mono); font-size: 0.95rem; transition: all 0.2s;
        }
        .drawer-btn:hover:not(:disabled) { border-color: var(--neon-green); color: var(--neon-green); }
        .drawer-btn:disabled { opacity: 0.3; cursor: default; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 2.2rem 2.5rem 3rem; }
        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.35s ease; }

        /* ===== 通用標題 ===== */
        h2 {
            font-family: var(--font-mono); font-size: 1.8rem; color: var(--neon-green);
            margin-bottom: 2rem; display: flex; align-items: center; gap: 0.6rem;
            text-shadow: 0 0 15px rgba(18,232,87,0.3);
        }
        h2::before { content: '#'; color: var(--neon-cyan); font-weight: 400; }
        .sub-title {
            font-family: var(--font-mono); font-size: 1.1rem; color: var(--text-primary);
            margin: 2.5rem 0 1.2rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .sub-title::before { content: '//'; color: var(--neon-cyan); }

        /* ===== About ===== */
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
        .about-text { color: var(--text-secondary); font-size: 1rem; }
        .about-text p { margin-bottom: 1rem; }
        .about-text strong { color: var(--text-primary); }

        /* ===== Skills ===== */
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .skill-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 1.5rem; transition: all 0.25s;
        }
        .skill-card:hover {
            border-color: var(--neon-green); background: var(--bg-card-hover);
            transform: translateY(-2px); box-shadow: 0 0 18px rgba(18,232,87,0.12);
        }
        .skill-card h3 { font-family: var(--font-mono); color: var(--neon-cyan); font-size: 1rem; margin-bottom: 1rem; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .skill-tag {
            background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--neon-green);
            font-family: var(--font-mono); font-size: 0.78rem; padding: 0.25rem 0.65rem; border-radius: 3px;
        }

        /* ===== 篩選按鈕 ===== */
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 2rem; }
        .filter-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
            font-family: var(--font-mono); font-size: 0.85rem; padding: 0.45rem 1rem;
            border-radius: 4px; cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .filter-btn.active { border-color: var(--neon-green); color: var(--neon-green); background: rgba(18,232,87,0.08); }

        /* ===== Blog 卡片 ===== */
        .post-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 1.5rem; overflow: hidden; transition: border-color 0.25s, box-shadow 0.25s;
        }
        .post-card:hover { border-color: var(--neon-green); box-shadow: 0 0 18px rgba(18,232,87,0.12); }
        .post-card.hidden { display: none; }
        .post-header {
            padding: 1.3rem 1.5rem; cursor: pointer; display: grid;
            grid-template-columns: 1fr auto; gap: 0.4rem 1rem; align-items: center; user-select: none;
        }
        .post-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem; font-family: var(--font-mono); font-size: 0.78rem; }
        .post-date { color: var(--text-muted); }
        .cat-tag { padding: 0.1rem 0.55rem; border-radius: 3px; border: 1px solid; }
        .cat-network { color: var(--neon-cyan); border-color: rgba(5,217,232,0.4); background: rgba(5,217,232,0.08); }
        .cat-web { color: #ffb74d; border-color: rgba(255,183,77,0.4); background: rgba(255,183,77,0.08); }
        .post-title { font-family: var(--font-mono); font-size: 1.05rem; color: var(--neon-cyan); font-weight: 600; }
        .post-desc { grid-column: 1 / 2; font-size: 0.9rem; color: var(--text-secondary); }
        .post-tags { grid-column: 1 / 2; display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .post-tag { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); background: rgba(85,102,119,0.15); padding: 0.1rem 0.5rem; border-radius: 3px; }
        .writeup-toggle { grid-column: 2 / 3; grid-row: 2 / 4; color: var(--text-muted); font-size: 1.2rem; transition: transform 0.3s; }
        .post-card.open .writeup-toggle { transform: rotate(180deg); }
        .writeup-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .post-card.open .writeup-body { max-height: 20000px; }
        .writeup-content { padding: 0 1.5rem 1.5rem; font-size: 0.92rem; color: var(--text-secondary); }
        .writeup-content h4 { font-family: var(--font-mono); color: var(--neon-green); font-size: 0.95rem; margin: 1.5rem 0 0.7rem; }
        .writeup-content h4:first-child { margin-top: 0; }
        .writeup-content p { margin-bottom: 0.8rem; }
        .writeup-content ul, .writeup-content ol { margin: 0.5rem 0 1rem 1.2rem; }
        .writeup-content li { margin-bottom: 0.3rem; }
        .writeup-content strong { color: var(--text-primary); }
        .writeup-content em { color: var(--neon-cyan); font-style: normal; }
        .writeup-content code { font-family: var(--font-mono); background: var(--code-bg); color: var(--neon-green); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.85rem; }
        .writeup-content pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.2rem; overflow-x: auto; margin: 0.8rem 0 1.2rem; font-size: 0.82rem; line-height: 1.6; }
        .writeup-content pre code { background: none; padding: 0; color: var(--text-primary); }
        .writeup-content .warning { color: #ff6b6b; }
        .writeup-content table { width: 100%; border-collapse: collapse; margin: 0.8rem 0 1.2rem; font-size: 0.85rem; }
        .writeup-content th, .writeup-content td { text-align: left; padding: 0.5rem 0.8rem; border: 1px solid var(--border); }
        .writeup-content th { background: var(--code-bg); color: var(--neon-cyan); font-family: var(--font-mono); font-weight: 600; }
        .writeup-content td { color: var(--text-secondary); }
        .writeup-content blockquote { border-left: 3px solid var(--neon-green); padding: 0.5rem 1rem; margin: 0.8rem 0; background: rgba(18,232,87,0.05); border-radius: 0 4px 4px 0; }
        .writeup-content blockquote strong { color: var(--neon-green); }

        /* ===== Resources ===== */
        .resource-category { font-family: var(--font-mono); color: var(--text-primary); font-size: 1.1rem; margin-bottom: 1.5rem; }
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; }
        .resource-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 1.3rem 1.5rem; transition: all 0.25s;
        }
        .resource-card:hover { border-color: var(--neon-green); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: 0 0 18px rgba(18,232,87,0.12); }
        .resource-name { font-family: var(--font-mono); color: var(--neon-cyan); font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .resource-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.8rem; }
        .resource-link { font-family: var(--font-mono); font-size: 0.8rem; color: var(--neon-green); text-decoration: none; }
        .resource-link:hover { opacity: 0.7; }

        /* ===== Contact ===== */
        .contact-grid { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .contact-link {
            display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem 1.5rem;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
            color: var(--text-secondary); text-decoration: none; font-family: var(--font-mono);
            font-size: 0.9rem; transition: all 0.25s;
        }
        .contact-link:hover { border-color: var(--neon-green); color: var(--neon-green); }
        .contact-icon { font-size: 1.2rem; }
        .contact-notice { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.9rem; margin-top: 1rem; }

        /* ===== Loading ===== */
        .loading { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.9rem; }
        .loading::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }

        /* ===== 窄螢幕 ===== */
        @media (max-width: 960px) {
            .home { grid-template-columns: 1fr; grid-template-rows: 56px auto auto auto; }
            .masthead { padding: 0 1.5rem; }
            .intro { border-right: none; border-bottom: 1px solid var(--border); padding: 3.5rem 1.5rem 2.5rem; }
            .hero-name { font-size: clamp(3rem, 16vw, 4.5rem); }
            .index { padding: 2rem 1.5rem 2.5rem; }
            .index-link { grid-template-columns: 38px 1fr 20px; gap: 0 1rem; padding: 1.1rem 0.4rem; }
            .index-desc { display: none; }
            .index-title { font-size: 1.3rem; }
            .colophon { flex-direction: column; align-items: flex-start; padding: 1.2rem 1.5rem; }
            .drawer-bar { padding: 0.8rem 1rem; }
            .drawer-body { padding: 1.6rem 1.3rem 2.5rem; }
            .about-grid { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

    <div class="drawer-body" id="drawer-body">
        <div class="panel" id="page-about"><div id="about-content"><p class="loading">Loading</p></div></div>
        <div class="panel" id="page-blog"><div id="blog-content"><p class="loading">Loading</p></div></div>
        <div class="panel" id="page-resources"><div id="resources-content"><p class="loading">Loading</p></div></div>
        <div class="panel" id="page-contact"><div id="contact-content"><p class="loading">Loading</p></div></div>
    </div>
</aside>

<script>
// ===== 工具函式 =====
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fetchJSON = url => fetch(url).then(r => r.json());
const fetchHTML = url => fetch(url).then(r => r.text());

// ===== 側滑面板（以 #hash 決定開哪一頁） =====
const PAGES = [...$$('.index-link')].map(a => a.dataset.page);
let lastFocus = null;

function openPanel(name) {
    const link = $(`.index-link[data-page="${name}"]`);
    const i = PAGES.indexOf(name);
    $('#drawer-num').textContent = link ? link.querySelector('.index-num').textContent : '';
    $('#drawer-label').textContent = link ? link.querySelector('.index-title').textContent : '';
    $('#drawer-prev').disabled = i <= 0;
    $('#drawer-next').disabled = i === -1 || i >= PAGES.length - 1;
    $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
    $$('.index-link').forEach(a => a.classList.toggle('active', a.dataset.page === name));
    $('#drawer-body').scrollTop = 0;
    if (!document.body.classList.contains('drawer-open')) lastFocus = document.activeElement;
    document.body.classList.add('drawer-open');
    $('#drawer-close').focus({ preventScroll: true });
}

function closePanel() {
    document.body.classList.remove('drawer-open');
    $$('.index-link').forEach(a => a.classList.remove('active'));
    if (lastFocus) lastFocus.focus({ preventScroll: true });
}

function route() {
    const name = location.hash.slice(1);
    if (name && $('#page-' + name)) openPanel(name); else closePanel();
}

const goTo = name => location.replace('#' + name);
const step = d => {
    const i = PAGES.indexOf(location.hash.slice(1));
    if (i !== -1 && PAGES[i + d]) goTo(PAGES[i + d]);
};
const close = () => {
    history.pushState(null, '', location.pathname + location.search);
    closePanel();
};

// ===== 渲染：主視覺 =====
function renderHero(p) {
    $('#hero-content').innerHTML = `
        <p class="hero-greeting">${p.greeting}</p>
        <p class="hero-hello">Hi, I'm</p>
        <h1 class="hero-name">${p.name}</h1>
        <div class="hero-tagline">
            <p class="hero-title">${p.title}</p>
            <p class="hero-desc">${p.description}</p>
        </div>
        <div class="terminal-prompt">
            <span style="color:var(--neon-green)">frog@parrot</span><span style="color:var(--text-muted)">:</span><span style="color:var(--neon-cyan)">~</span><span style="color:var(--text-muted)">$</span> <span class="cursor"></span>
        </div>
    `;
}

// ===== 渲染：關於我 =====
function renderAbout(p) {
    const aboutAll = p.about.map(t => `<p>${t}</p>`).join('');
    const skills = (p.skills || []).map(s => `
        <div class="skill-card">
            <h3>${s.icon} ${s.name}</h3>
            <div class="skill-tags">${s.tags.map(t => `<span class="skill-tag">${t}</span>`).join('')}</div>
        </div>
    `).join('');

    const skillsSection = skills ? `<h3 class="sub-title">技術能力</h3><div class="skills-grid">${skills}</div>` : '';

    $('#about-content').innerHTML = `
        <h2>關於我</h2>
        <div class="about-text">${aboutAll}</div>
        ${skillsSection}
    `;
}

// ===== 渲染：學習隨筆 =====
async function renderBlog(posts) {
    // 取得所有不重複的分類
    const categories = [...new Set(posts.map(p => p.category))];
    const filterBtns = `
        <button class="filter-btn active" data-filter="all">全部</button>
        ${categories.map(c => `<button class="filter-btn" data-filter="${c}">${c}</button>`).join('')}
    `;

    // 建立卡片（內容先空，後面非同步載入）
    const cards = posts.map(post => `
        <article class="post-card" data-category="${post.category}" id="post-${post.id}">
            <div class="post-header" role="button" tabindex="0" aria-expanded="false">
                <div class="post-meta">
                    <time class="post-date" datetime="${post.date}">${post.date}</time>
                    <span class="cat-tag ${post.categoryClass}">${post.category}</span>
                </div>
                <h3 class="post-title">${post.title}</h3>
                <p class="post-desc">${post.description}</p>
                <div class="post-tags">${post.tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}</div>
                <span class="writeup-toggle">▼</span>
            </div>
            <div class="writeup-body">
                <div class="writeup-content"><p class="loading">Loading</p></div>
            </div>
        </article>
    `).join('');

    $('#blog-count').textContent = `${posts.length} 篇筆記`;
    $('#blog-content').innerHTML = `
        <h2>學習隨筆</h2>
        <div class="filter-bar" id="filter-bar">${filterBtns}</div>
        ${cards}
    `;

    // 非同步載入每篇文章內容
    for (const post of posts) {
        try {
            const html = await fetchHTML(post.file);
            const el = document.querySelector(`#post-${post.id} .writeup-content`);
            if (el) el.innerHTML = html;
        } catch (e) {
            const el = document.querySelector(`#post-${post.id} .writeup-content`);
            if (el) el.innerHTML = `<p class="warning">⚠️ 載入失敗: ${post.file}</p>`;
        }
    }

    // 綁定篩選
    $$('#filter-bar .filter-btn').forEach(btn => btn.addEventListener('click', () => {
        $$('#filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        $$('.post-card').forEach(p => p.classList.toggle('hidden', !(f === 'all' || p.dataset.category === f)));
    }));

    // 綁定展開
    $$('.post-header').forEach(header => {
        const toggle = () => {
            const card = header.parentElement;
            card.classList.toggle('open');
            header.setAttribute('aria-expanded', String(card.classList.contains('open')));
        };
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
    });
}

// ===== 渲染：資源分享 =====
function renderResources(data) {
    const sections = data.map(cat => `
        <h3 class="resource-category">${cat.category}</h3>
        <div class="resource-grid">
            ${cat.tools.map(t => `
                <div class="resource-card">
                    <div class="resource-name">${t.name}</div>
                    <div class="resource-desc">${t.desc}</div>
                    <a href="${t.url}" class="resource-link">→ 前往工具頁</a>
                </div>
            `).join('')}
        </div>
    `).join('');

    $('#resources-content').innerHTML = `<h2>資源分享</h2>${sections}`;
}

// ===== 渲染：聯繫我 =====
function renderContact(p) {
    const links = p.contact.map(c => `
        <a href="${c.url}" class="contact-link"><span class="contact-icon">${c.icon}</span> ${c.label}</a>
    `).join('');
    $('#contact-content').innerHTML = `
        <h2>聯繫我</h2>
        <div class="contact-grid">${links}</div>
        <p class="contact-notice">即將上線，敬請期待 🚧</p>
    `;
}

// ===== 初始化 =====
async function init() {
    try {
        const [profile, posts, resources] = await Promise.all([
            fetchJSON('data/profile.json'),
            fetchJSON('data/posts.json'),
            fetchJSON('data/resources.json')
        ]);

        renderHero(profile);
        renderAbout(profile);
        renderResources(resources);
        renderContact(profile);
        await renderBlog(posts);
    } catch (e) {
        console.error('載入資料失敗:', e);
    }
}

// ===== 事件綁定 =====
window.addEventListener('hashchange', route);
$('#scrim').addEventListener('click', close);
$('#drawer-close').addEventListener('click', close);
$('#drawer-prev').addEventListener('click', () => step(-1));
$('#drawer-next').addEventListener('click', () => step(1));
$('.logo').addEventListener('click', e => { e.preventDefault(); close(); });

// 鍵盤快捷：1–3 開啟、Esc 關閉、←→ 切換
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const open = document.body.classList.contains('drawer-open');
    if (e.key === 'Escape') return open && close();
    if (open && e.key === 'ArrowLeft') return step(-1);
    if (open && e.key === 'ArrowRight') return step(1);
    const target = PAGES[Number(e.key) - 1];
    if (target) open ? goTo(target) : (location.hash = target);
});

// 啟動
init();
route();
</script>

</body>
</html>
